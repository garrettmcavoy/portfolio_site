name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore optimized image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/assets/images/**', 'src/components/GalleryPhoto.astro', 'src/components/OptimizedImage.astro') }}
          restore-keys: astro-images-${{ runner.os }}-
      - name: Check types
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
      - name: Test production site
        run: npm test
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
